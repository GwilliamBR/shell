name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"
      - "v*.*.*-beta*"
  pull_request:
    branches:
      - main
      - rc
  workflow_dispatch:

permissions:
  contents: read

env:
  UUID: pop-shell@system76.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag branch constraint
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin

          if [[ "${TAG_NAME}" =~ -rc ]] || [[ "${TAG_NAME}" =~ -beta ]]; then
            if ! git branch -r --contains "${TAG_NAME}" | grep -Eq '^[[:space:]]*origin/rc$'; then
              echo "::error::Pre-release tag ${TAG_NAME} (rc/beta) must be on the 'rc' branch."
              exit 1
            fi
          else
            if ! git branch -r --contains "${TAG_NAME}" | grep -Eq '^[[:space:]]*origin/(main|master)$'; then
              echo "::error::Production tag ${TAG_NAME} must be on 'main' or 'master'."
              exit 1
            fi
          fi

      - name: Check package.json version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG_VERSION="${TAG_NAME#v}"
          TAG_BASE="${TAG_VERSION%%-*}"
          if [ "${PKG_VERSION}" != "${TAG_BASE}" ]; then
            echo "::error::package.json (${PKG_VERSION}) does not match git tag (${TAG_BASE})"
            exit 1
          fi

      - name: Check metadata.json UUID matches workflow env
        run: |
          META_UUID=$(jq -r '.uuid' metadata.json)
          if [ "${META_UUID}" != "${UUID}" ]; then
            echo "::error::metadata.json UUID '${META_UUID}' does not match '${UUID}'"
            exit 1
          fi

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: verify-versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-bin \
            zip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality checks
        run: |
          make lint
          make format-check
          make type-check
          make test

      - name: Determine package version for zip name
        id: pkg-version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(jq -r '.version' package.json)
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          make pack
          VERSION="${{ steps.pkg-version.outputs.VERSION }}"
          ZIP_NAME="${UUID}-v${VERSION}.zip"
          mv "${UUID}.zip" "${ZIP_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          unzip -l "${ZIP_NAME}"

      - name: Verify no gi://Gdk import in extension process files
        run: |
          OFFENDERS=$(grep -rl "gi://Gdk" dist/ --include="*.js" \
            | grep -v "prefs.js" \
            | grep -v "color_dialog" \
            | grep -v "floating_exceptions" || true)
          if [ -n "${OFFENDERS}" ]; then
            echo "::error::Forbidden gi://Gdk import found in extension process:"
            echo "${OFFENDERS}"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: extension
          path: artifacts/

      - name: Extract version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from commits
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG_NAME}^" 2>/dev/null || true)
          if [ -n "${PREV_TAG}" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | head -50)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -50)
          fi
          DELIM="CHANGELOG_EOF_${RANDOM}_$$"
          {
            echo "CHANGELOG<<${DELIM}"
            printf '%s\n' "${LOG:-No changes recorded.}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          python3 - <<'PYEOF'
          import os
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          uuid = os.environ["UUID"]
          changelog = os.environ["CHANGELOG"]

          lines = []
          if "-rc" in version or "-beta" in version:
              lines.extend([
                  "> [!WARNING]",
                  "> Pre-release build for testing and feedback.",
                  "",
              ])

          lines.extend([
              f"## Pop Shell v{version}",
              "",
              "Updated fork with GNOME Shell 48, 49, 50, and 51 support and the updated launcher.",
              "",
              "### Quick Install",
              "```bash",
              f"curl -fsSL https://raw.githubusercontent.com/{repo}/main/scripts/install.sh | bash",
              "```",
              "",
              "### Manual Install",
              "```bash",
              f"gnome-extensions install --force ~/Downloads/{uuid}-v{version}.zip",
              f"gnome-extensions enable {uuid}",
              "```",
              "*Log out and back in on Wayland to load the updated extension.*",
              "",
              "### Changes since last release",
              changelog,
              "",
          ])

          with open("release_notes.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines))
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "v${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
