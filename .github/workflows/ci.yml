name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  UUID: pop-shell@system76.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-bin \
            zip

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Run TypeScript type checks
        run: make type-check

      - name: Run unit, integration, and fuzz tests
        run: make test

      - name: Package extension
        run: make pack

      - name: Verify build output and GNOME extension rules
        run: |
          test -f dist/extension.js || (echo "::error::dist/extension.js missing" && exit 1)
          test -f dist/prefs.js || (echo "::error::dist/prefs.js missing" && exit 1)

          OFFENDERS=$(grep -rl "gi://Gdk" dist/ --include="*.js" \
            | grep -v "prefs.js" \
            | grep -v "color_dialog" \
            | grep -v "floating_exceptions" || true)
          if [ -n "${OFFENDERS}" ]; then
            echo "::error::Forbidden gi://Gdk import found in extension process:"
            echo "${OFFENDERS}"
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "${UUID}.zip")
          MAX_BYTES=$((10 * 1024 * 1024))
          echo "Zip size: ${SIZE_BYTES} bytes (limit: ${MAX_BYTES})"
          if [ "${SIZE_BYTES}" -gt "${MAX_BYTES}" ]; then
            echo "::error::Zip exceeds 10 MB limit"
            exit 1
          fi
